<!DOCTYPE html>
<html>
<head>
    <title>Coba Input</title>
</head>
<body>

<h2>Input Radio</h2>
<form>
    <input type="radio" name="gender" value="Laki-laki"> Laki-laki<br>
    <input type="radio" name="gender" value="Perempuan"> Perempuan<br>
</form>

<p> radio bisa pilih lebih dari satu </p>

<hr>

<h2>Checkbox</h2>
<form>
    <input type="checkbox" name="hobi" value="Makan"> Makan<br>
    <input type="checkbox" name="hobi" value="Game"> Game<br>
</form>

<p> checkbox bisa pilih lebih dari 1 </p>

<hr>

<h2>Input Type</h2>
<form>
    Nama: <input type="text"><br>
    Password: <input type="password"><br>
    Email: <input type="email"><br>
    Tanggal: <input type="date"><br>
</form>

<p>setiap tipe punya fungsi berbeda</p>

</body>
</html>
