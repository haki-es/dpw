<!DOCTYPE html>
<html lang="en">
<head>
  <title>Halaman Event</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="Haki Eko Saputra">
  <meta name="nim" content="253307013">
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, Helvetica, sans-serif; }
    header {
      background-color: #00ff;
      padding: 30px;
      text-align: center;
      font-size: 35px;
      color: white;
    }
    nav {
      float: left;
      width: 30%;
      background: #ccc;
      padding: 20px;
      min-height: 300px;
    }
    nav ul { list-style-type: none; padding: 0; }
    article {
      float: left;
      padding: 20px;
      width: 70%;
      background-color: #f1f1f1;
      min-height: 300px;
    }
    section::after { content: ""; display: table; clear: both; }
    footer {
      background-color: #777;
      padding: 10px;
      text-align: center;
      color: white;
    }
    .gallery { display: flex; flex-wrap: wrap; gap: 8px; }
    .gallery img {
      width: 180px;
      height: 130px;
      object-fit: cover;
      border: 2px solid #ccc;
      cursor: pointer;
      transition: transform 0.2s;
    }
    #event-info {
      margin-top: 10px;
      padding: 8px 12px;
      background: #ffffcc;
      border: 1px solid #cccc00;
      border-radius: 4px;
      font-size: 14px;
      min-height: 30px;
    }
    @media (max-width: 600px) {
      nav, article { width: 100%; height: auto; }
    }
  </style>
</head>
<body>
  <header>
    <h2>Event Tahunan</h2>
  </header>

  <section>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="gambar.html">Gambar</a></li>
        <li><a href="event.html">Event</a></li>
        <li><a href="audio.html">Audio</a></li>
        <li><a href="video.html">Video</a></li>
        <li><a href="svg.html">SVG</a></li>
        <li><a href="canvas.html">Canvas</a></li>
      </ul>
    </nav>

    <article>
      <h1>Event Terbatas</h1>
      <p>event yang hanya muncul secara terbatas dan limited hanya bisa di dapatkan dengan waktu yang ditentukan.</p>

      <div class="gallery">
        
        <img src="https://news.ratushop.id/_next/image?url=https%3A%2F%2Fcdn.bjkreatif.co.id%2Fnews.ratushop.id%2Fgallery%2FTOP%20UP%20FF.jpg&w=3840&q=75" alt=" 1"
          onmouseover="showEvent('onmouseover: Mouse masuk ke Gambar 1')"
          onmouseout="showEvent('onmouseout: Mouse keluar dari Gambar 1')"
          onclick="showEvent('onclick: Gambar 1 diklik!')">

        <img src="https://news.ratushop.id/_next/image?url=https%3A%2F%2Fcdn.bjkreatif.co.id%2Fnews.ratushop.id%2Fgallery%2FTOP%20UP%20FF.jpg&w=3840&q=75" alt=" 2"
          onmousemove="showEvent('onmousemove: Mouse bergerak di Gambar 2')"
          onmouseout="showEvent('onmouseout: Mouse keluar dari Gambar 2')"
          ondblclick="showEvent('ondblclick: Gambar 2 double-diklik!')">

        <img src="https://news.ratushop.id/_next/image?url=https%3A%2F%2Fcdn.bjkreatif.co.id%2Fnews.ratushop.id%2Fgallery%2FTOP%20UP%20FF.jpg&w=3840&q=75" alt="
        3"
          onmousedown="showEvent('onmousedown: Tombol mouse ditekan di Gambar 3')"
          onmouseup="showEvent('onmouseup: Tombol mouse dilepas di Gambar 3')"
          onmouseout="showEvent('onmouseout: Mouse keluar dari Gambar 3')">

        <img src="https://news.ratushop.id/_next/image?url=https%3A%2F%2Fcdn.bjkreatif.co.id%2Fnews.ratushop.id%2Fgallery%2FTOP%20UP%20FF.jpg&w=3840&q=75" alt=" 4"
          onmouseover="this.style.transform='scale(1.1)'; showEvent('onmouseover: Gambar 4 diperbesar')"
          onmouseout="this.style.transform='scale(1)'; showEvent('onmouseout: Gambar 4 kembali normal')">

        <img src="https://news.ratushop.id/_next/image?url=https%3A%2F%2Fcdn.bjkreatif.co.id%2Fnews.ratushop.id%2Fgallery%2FTOP%20UP%20FF.jpg&w=3840&q=75" alt=" 5"
          onmouseover="this.style.opacity='0.5'; showEvent('onmouseover: Gambar 5 transparan')"
          onmouseout="this.style.opacity='1'; showEvent('onmouseout: Gambar 5 normal kembali')">

        <img src="https://news.ratushop.id/_next/image?url=https%3A%2F%2Fcdn.bjkreatif.co.id%2Fnews.ratushop.id%2Fgallery%2FTOP%20UP%20FF.jpg&w=3840&q=75" alt=" 6"
          onclick="showEvent('onclick: Gambar 6 diklik!')"
          oncontextmenu="showEvent('oncontextmenu: Klik kanan di Gambar 6'); return false;">
      </div>

      <div id="event-info">Arahkan mouse ke gambar untuk melihat event...</div>
    </article>
  </section>

  <footer>
    <p>www.hakinewssince2026.com</p>
  </footer>

  <script>
    function showEvent(msg) {
      document.getElementById('event-info').innerHTML = '&#128161; <strong>Event:</strong> ' + msg;
    }
  </script>
</body>
</html>
