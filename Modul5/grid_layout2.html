<!DOCTYPE html>
<html lang="en">
<head>
    <title>Tes Grid</title>
    <style>
        .grid-container {
            display: grid;
            grid-gap: 50px;
            background-color: #2196F3;
            padding: 10px;
            [span_22](start_span)/* Skenario 2: Mengubah kolom[span_22](end_span) */
            grid-template-columns: auto auto auto auto; 
        }
        .item1 {
            background-color: rgba(255, 255, 255, 0.8);
            padding: 20px;
            font-size: 30px;
            text-align: center;

            [span_23](start_span)/* Skenario 1: Spanning kolom[span_23](end_span) */
            grid-column-start: 1;
            grid-column-end: 3;

            [span_24](start_span)/* Skenario 1: Spanning baris[span_24](end_span) */
            /* grid-row: 1 / 4; */
        }
        .item {
            background-color: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(0, 0, 0, 0.8);
            padding: 20px;
            font-size: 30px;
            [span_25](start_span)[span_26](start_span)text-align: center;[span_25](end_span)[span_26](end_span)
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <div class="item1">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
        <div class="item">7</div>
        <div class="item">8</div>
    </div>
</body>
</html>
